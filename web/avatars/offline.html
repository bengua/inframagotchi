<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>inframagotchi — offline state</title>
<style>
  :root{--bg:#0a0a0e;--bg2:#13131b;--ink:#e7e9f0;--muted:#6f7484;--neon:#28ff96;--alarm:#ff4860;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 120% at 50% 30%,var(--bg2),var(--bg) 72%);
    color:var(--ink);font-family:var(--mono);display:flex;align-items:center;justify-content:center;overflow:hidden}
  main{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--alarm);box-shadow:0 0 10px var(--alarm)}
  @media (max-width: 400px){
    html,body{background:transparent !important}
    main{padding:0 !important;gap:0 !important;max-width:none !important;height:100vh !important;justify-content:center !important}
    .rig,.quip,.menu-btn,header,.dot,.rowlab{display:none !important}
    canvas{width:auto !important;height:96vh !important;max-width:96vw !important;filter:none !important}
  }
  canvas{display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
  .row{display:flex;gap:8px}
  button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    background:transparent;border:1px solid #23242e;padding:6px 11px;border-radius:2px;cursor:pointer}
  button:hover{color:var(--ink);border-color:#34363f}
  button.on{color:var(--neon);border-color:var(--neon)}
  .legend{font-size:11px;color:#494d5a;letter-spacing:.04em;text-align:center;max-width:36ch}
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span class="dot"></span><span>inframagotchi // offline</span></div>
  <canvas id="c" width="420" height="470"></canvas>
  <div class="row">
    <button data-r="404" class="on">404</button>
    <button data-r="CONNECTION LOST">conn lost</button>
    <button data-r="TIMEOUT">timeout</button>
    <button data-r="ENGINE DOWN">engine down</button>
  </div>
  <div class="legend">// shared by every avatar — shown when the engine can't be reached</div>
</main>
<script>
"use strict";
const cv=document.getElementById("c"), X=cv.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let reason="404", t0=performance.now();

function tombstone(cx,top,bot,sw){
  const g=X.createLinearGradient(0,top,0,bot);
  g.addColorStop(0,"#4e545f");g.addColorStop(1,"#2c313b");
  X.save();X.beginPath();
  X.arc(cx,top+sw,sw,Math.PI,0);            // rounded top
  X.lineTo(cx+sw,bot);X.lineTo(cx-sw,bot);X.closePath();
  X.fillStyle=g;X.fill();
  X.lineWidth=4;X.strokeStyle="#22262e";X.stroke();
  X.clip();
  // inner bevel
  X.strokeStyle="rgba(150,158,172,.5)";X.lineWidth=2;X.beginPath();
  X.arc(cx,top+sw,sw-7,Math.PI,0);X.stroke();
  // crack
  X.strokeStyle="#23272f";X.lineWidth=2;X.beginPath();
  X.moveTo(cx+sw*0.3,top+sw*0.7);X.lineTo(cx+sw*0.08,top+sw*1.4);X.lineTo(cx+sw*0.42,top+sw*2.0);X.stroke();
  X.restore();
  // engraving R.I.P. (carved: light edge + dark face)
  X.textAlign="center";X.font="bold 46px "+getComputedStyle(document.body).fontFamily;
  X.fillStyle="rgba(150,158,172,.55)";X.fillText("R.I.P.",cx,top+sw*0.92-2);
  X.fillStyle="#2a2e36";X.fillText("R.I.P.",cx,top+sw*0.92);
  X.strokeStyle="#565d68";X.lineWidth=2;X.beginPath();
  X.moveTo(cx-sw*0.55,top+sw*1.28);X.lineTo(cx+sw*0.55,top+sw*1.28);X.stroke();
  // error message (neon)
  X.save();X.shadowColor="#28ff96";X.shadowBlur=14;X.fillStyle="#7df0b8";
  X.font="bold 22px "+getComputedStyle(document.body).fontFamily;X.fillText(reason,cx,top+sw*1.62);X.restore();
  X.fillStyle="#6a727f";X.font="13px "+getComputedStyle(document.body).fontFamily;
  X.fillText("engine unreachable",cx,top+sw*1.95);
}

function ghost(gx,gy,gw,t){
  X.save();
  X.shadowColor="rgba(150,220,255,.9)";X.shadowBlur=26;
  X.fillStyle="rgba(224,242,255,.94)";
  const n=4,w=2*gw/n;
  X.beginPath();X.arc(gx,gy,gw,Math.PI,0);X.lineTo(gx+gw,gy+gw);
  for(let i=0;i<n;i++){const bx=gx+gw-w/2-w*i, off=reduce?0:Math.sin(t*4+i)*gw*0.08;
    X.arc(bx,gy+gw+off,w/2,0,Math.PI,false);}
  X.lineTo(gx-gw,gy);X.closePath();X.fill();
  // arms
  X.beginPath();X.ellipse(gx-gw*1.05,gy+gw*0.55,gw*0.26,gw*0.34,0,0,7);
  X.ellipse(gx+gw*1.05,gy+gw*0.55,gw*0.26,gw*0.34,0,0,7);X.fill();
  X.restore();
  // face x_x + sad mouth
  X.strokeStyle="#33405a";X.lineWidth=4;X.lineCap="round";
  for(const sgn of[-1,1]){const ex=gx+sgn*gw*0.42,ey=gy+gw*0.45,r=gw*0.16;
    X.beginPath();X.moveTo(ex-r,ey-r);X.lineTo(ex+r,ey+r);X.moveTo(ex-r,ey+r);X.lineTo(ex+r,ey-r);X.stroke();}
  X.beginPath();X.arc(gx,gy+gw*0.95,gw*0.2,Math.PI+0.4,2*Math.PI-0.4);X.stroke();
}

function frame(now){
  const t=(now-t0)/1000, W=cv.width/(Math.min(devicePixelRatio||1,2)), H=cv.height/(Math.min(devicePixelRatio||1,2));
  X.setTransform(Math.min(devicePixelRatio||1,2),0,0,Math.min(devicePixelRatio||1,2),0,0);
  X.clearRect(0,0,W,H);
  const cx=W/2;
  // low neon haze (soft pulse)
  const pulse=0.5+0.5*Math.sin(t*1.3);
  let hz=X.createRadialGradient(cx,H*0.9,10,cx,H*0.9,W*0.5);
  hz.addColorStop(0,`rgba(40,255,150,${0.12+0.05*pulse})`);hz.addColorStop(1,"rgba(40,255,150,0)");
  X.fillStyle=hz;X.fillRect(0,0,W,H);
  // ground + mound
  X.fillStyle="#16130f";X.fillRect(0,H*0.82,W,H*0.18);
  X.fillStyle="#1b1813";X.beginPath();X.ellipse(cx,H*0.84,W*0.3,H*0.05,0,0,7);X.fill();
  // tombstone
  const sw=W*0.3, top=H*0.42, bot=H*0.85;
  tombstone(cx,top,bot,sw);
  // mist drifting
  for(let i=0;i<3;i++){const mx=cx+Math.sin(t*0.5+i*2)*W*0.18*(i-1),my=bot-6+i*5,mw=W*0.22*(1+0.1*Math.sin(t+i));
    const mg=X.createRadialGradient(mx,my,2,mx,my,mw);
    mg.addColorStop(0,`rgba(190,220,210,${0.10+0.04*Math.sin(t*0.8+i)})`);mg.addColorStop(1,"rgba(190,220,210,0)");
    X.fillStyle=mg;X.beginPath();X.ellipse(mx,my,mw,12,0,0,7);X.fill();}
  // ghost floating above the stone
  const gw=W*0.12, gx=cx+(reduce?0:Math.sin(t*0.8)*5), gy=top-H*0.02+(reduce?0:Math.sin(t*1.5)*7);
  ghost(gx,gy,gw,t);
  requestAnimationFrame(frame);
}
document.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
  reason=b.dataset.r;document.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");}));
const dpr=Math.min(devicePixelRatio||1,2);
cv.width=420*dpr;cv.height=470*dpr;cv.style.width="420px";cv.style.height="470px";
requestAnimationFrame(frame);
</script>
</body>
</html>
