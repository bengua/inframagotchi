<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>inframagotchi — hamster</title>
<style>
  :root{--bg:#0a0a0e;--bg2:#13131b;--ink:#e7e9f0;--muted:#6f7484;--neon:#46ffaa;--alarm:#ff4860;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 120% at 50% 30%,var(--bg2),var(--bg) 72%);
    color:var(--ink);font-family:var(--mono);display:flex;align-items:center;justify-content:center;overflow:hidden}
  main{display:flex;flex-direction:column;align-items:center;gap:13px;padding:20px}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon);transition:.4s}
  @media (max-width: 400px){
    html,body{background:transparent !important}
    main{padding:0 !important;gap:0 !important;max-width:none !important;height:100vh !important;justify-content:center !important}
    .rig,.quip,.menu-btn,header,.dot,.rowlab{display:none !important}
    canvas{width:auto !important;height:96vh !important;max-width:96vw !important;filter:none !important}
  }
  canvas{display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
  .quip{min-height:1.4em;color:var(--muted);font-size:14px;text-align:center;max-width:34ch}
  .rig{display:flex;flex-direction:column;gap:11px;width:300px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .rowlab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .rowlab b{color:var(--ink);font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none}
  #hp{background:linear-gradient(90deg,var(--alarm),#ffb13b 50%,var(--neon))}
  #ld{background:linear-gradient(90deg,#2a2c36,#46ffaa)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--ink);border:2px solid #0a0a0e;box-shadow:0 0 12px rgba(255,255,255,.35);cursor:grab}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--ink);border:2px solid #0a0a0e;cursor:grab}
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span class="dot" id="dot"></span><span>inframagotchi // hamster</span></div>
  <canvas id="c" width="360" height="380"></canvas>
  <p class="quip" id="quip"></p>
  <div class="rig">
    <div class="ctl"><div class="rowlab"><span>infra health</span><b id="hpv">100%</b></div><input type="range" id="hp" min="0" max="100" value="100"></div>
    <div class="ctl"><div class="rowlab"><span>cpu load</span><b id="ldv">60%</b></div><input type="range" id="ld" min="0" max="100" value="60"></div>
  </div>
</main>
<script>
"use strict";
const cv=document.getElementById("c"), X=cv.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const Lr=(a,b,k)=>a+(b-a)*k, CL=(v,a,b)=>Math.max(a,Math.min(b,v));
const MIX=(c1,c2,k)=>[Lr(c1[0],c2[0],k),Lr(c1[1],c2[1],k),Lr(c1[2],c2[2],k)];
const RGB=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const FUR=[240,190,100],FUR_DK=[198,150,70],FACE=[252,238,205],EARIN=[236,176,168],
      NOSE=[232,120,135],INK=[48,32,16],DULL=[180,160,132],RED=[255,72,96];
let health=1,target=1,load=0.6,loadT=0.6,blink=0,nextBlink=1600,t0=performance.now();

function star(x,y,r,a){X.save();X.globalAlpha=a;X.fillStyle="#fff";X.beginPath();
  for(let i=0;i<8;i++){const rr=i%2?r*0.42:r,an=-Math.PI/2+i*Math.PI/4;X[i?"lineTo":"moveTo"](x+Math.cos(an)*rr,y+Math.sin(an)*rr);}
  X.closePath();X.fill();X.restore();}

function drawHamster(cx,floorY,s,h,ld,t){
  const droop=1-h, fur=MIX(FUR,DULL,droop*0.8), fdk=MIX(FUR_DK,DULL,droop*0.7), face=MIX(FACE,DULL,droop*0.6);
  const ko=h<0.12, collapse=h<0.15?(0.15-h)/0.15:0;
  const scamper=ko?0:ld, speed=1.5+ld*7;
  const bob=reduce?0:Math.sin(t*speed)*s*0.13*scamper;
  const legA=reduce?0:Math.sin(t*speed);
  const RT=s*1.15;
  X.save();
  X.translate(cx,floorY);
  if(collapse>0){X.scale(1,1-0.5*collapse);X.translate(0,s*0.7*collapse);}
  X.translate(0,-bob);
  const headY=-s*2.0, bodyY=headY+RT*0.95;
  // shadow handled outside; here body/head local (origin = floor contact at 0,0)
  // ---- body ----
  let bg=X.createRadialGradient(-s*0.4,bodyY-s*0.3,2,0,bodyY,s*1.1);
  bg.addColorStop(0,RGB(MIX(fur,[255,255,255],0.12)));bg.addColorStop(1,RGB(MIX(fur,INK,0.18)));
  X.fillStyle=bg;X.strokeStyle=RGB(INK);X.lineWidth=3;
  X.beginPath();X.ellipse(0,bodyY,s*0.85,s*0.62,0,0,7);X.fill();X.stroke();
  X.fillStyle=RGB(face);X.beginPath();X.ellipse(0,bodyY+s*0.08,s*0.5,s*0.42,0,0,7);X.fill();
  // arms + running feet (alternate with legA)
  for(const sgn of[-1,1]){
    const ph=sgn*legA;
    X.fillStyle=RGB(fur);X.strokeStyle=RGB(INK);X.lineWidth=2;
    X.beginPath();X.ellipse(sgn*s*0.52,bodyY+s*0.05+ph*s*0.06*scamper,s*0.13,s*0.2,0,0,7);X.fill();X.stroke();
    X.fillStyle=RGB(fdk);
    X.beginPath();X.ellipse(sgn*s*0.34,bodyY+s*0.6-ph*s*0.12*scamper,s*0.18,s*0.13,0,0,7);X.fill();X.stroke();
  }
  // ---- ears ----
  for(const sgn of[-1,1]){const ex=sgn*RT*0.62;
    X.fillStyle=RGB(fur);X.strokeStyle=RGB(INK);X.lineWidth=3;
    X.beginPath();X.ellipse(ex,headY-RT*0.62,s*0.3,s*0.3,0,0,7);X.fill();X.stroke();
    X.fillStyle=RGB(EARIN);X.beginPath();X.ellipse(ex,headY-RT*0.6,s*0.16,s*0.18,0,0,7);X.fill();}
  // ---- head ----
  let hg=X.createRadialGradient(-RT*0.35,headY-RT*0.4,3,0,headY,RT*1.1);
  hg.addColorStop(0,RGB(MIX(fur,[255,255,255],0.16)));hg.addColorStop(1,RGB(MIX(fur,INK,0.16)));
  X.fillStyle=hg;X.strokeStyle=RGB(INK);X.lineWidth=3;
  X.beginPath();X.ellipse(0,headY,RT,RT*0.85,0,0,7);X.fill();X.stroke();
  // cheek pouches
  for(const sgn of[-1,1]){X.fillStyle=RGB(fur);X.strokeStyle=RGB(INK);X.lineWidth=2;
    X.beginPath();X.ellipse(sgn*RT*0.5,headY+RT*0.45,RT*0.55,RT*0.4,0,0,7);X.fill();X.stroke();}
  // face patch
  X.fillStyle=RGB(face);X.beginPath();X.ellipse(0,headY+RT*0.33,RT*0.5,RT*0.45,0,0,7);X.fill();
  // ---- eyes ----
  const eyDX=RT*0.46, eyY=headY-RT*0.12, eR=RT*0.34;
  for(const sgn of[-1,1]){const ex=sgn*eyDX;
    if(ko){X.strokeStyle=RGB(INK);X.lineWidth=5;X.lineCap="round";X.beginPath();
      X.moveTo(ex-eR*0.6,eyY-eR*0.6);X.lineTo(ex+eR*0.6,eyY+eR*0.6);X.moveTo(ex-eR*0.6,eyY+eR*0.6);X.lineTo(ex+eR*0.6,eyY-eR*0.6);X.stroke();continue;}
    if(h<0.6){X.save();X.shadowColor=RGB(RED);X.shadowBlur=16*(0.6-h)/0.6+4;}
    X.fillStyle="#fff";X.strokeStyle=RGB(INK);X.lineWidth=2;X.beginPath();X.ellipse(ex,eyY,eR,eR*1.12,0,0,7);X.fill();X.stroke();
    if(h<0.6)X.restore();
    const lid=blink*eR*2;
    X.fillStyle=RGB(MIX(INK,RED,droop*0.7));X.beginPath();X.ellipse(ex,eyY,eR*0.82,eR*0.95,0,0,7);X.fill();
    X.fillStyle="#fff";X.beginPath();X.ellipse(ex-eR*0.28,eyY-eR*0.28,eR*0.34,eR*0.4,0,0,7);X.fill();
    X.globalAlpha=.8;X.beginPath();X.ellipse(ex+eR*0.28,eyY+eR*0.36,eR*0.16,eR*0.18,0,0,7);X.fill();X.globalAlpha=1;
    if(blink>0.04){X.fillStyle=RGB(fur);X.fillRect(ex-eR,eyY-eR*1.12,eR*2,lid);}
    if(droop>0.45){X.strokeStyle="rgba(150,110,80,.8)";X.lineWidth=2;X.beginPath();X.arc(ex,eyY+eR*0.5,eR*0.8,0.4,Math.PI-0.4);X.stroke();}
  }
  // ---- nose + mouth + whiskers ----
  const ny=headY+RT*0.3;
  X.fillStyle=RGB(NOSE);X.beginPath();X.ellipse(0,ny,s*0.14,s*0.1,0,0,7);X.fill();
  X.strokeStyle=RGB(INK);X.lineWidth=2;X.lineCap="round";
  X.beginPath();X.moveTo(0,ny+s*0.1);X.lineTo(0,ny+s*0.22);X.stroke();
  if(!ko){X.beginPath();X.arc(-s*0.16,ny+s*0.12,s*0.16,0.2,Math.PI-0.5);X.arc(s*0.16,ny+s*0.12,s*0.16,0.5,Math.PI-0.2);X.stroke();}
  X.strokeStyle="rgba(210,210,210,.85)";X.lineWidth=1.5;
  for(const sgn of[-1,1])for(const wy of[-0.04,0.05,0.14]){X.beginPath();X.moveTo(sgn*s*0.16,ny+s*0.02);X.lineTo(sgn*s*0.9,ny+s*(0.02+wy*2));X.stroke();}
  // emotes
  if(h>0.82&&!ko)star(eyDX+eR*0.8,eyY-eR*0.95,RT*0.16,0.5+0.5*Math.sin(t*4));
  if(h>0.3&&h<0.72){const ph=(t*0.7)%1,sx=RT*0.95,sy=headY-RT*0.5+ph*RT*0.5;X.fillStyle="#82cdff";X.globalAlpha=1-ph*0.3;
    X.beginPath();X.moveTo(sx,sy-s*0.14);X.quadraticCurveTo(sx+s*0.12,sy+s*0.05,sx,sy+s*0.12);X.quadraticCurveTo(sx-s*0.12,sy+s*0.05,sx,sy-s*0.14);X.fill();X.globalAlpha=1;}
  if(h<0.5&&!ko){const vx=-RT*0.95,vy=headY-RT*0.55,p=1+0.15*Math.sin(t*6);X.strokeStyle="#ff4a60";X.lineWidth=3.5;X.lineCap="round";
    for(let a=0;a<3;a++){const an=a*2*Math.PI/3;X.beginPath();
      X.moveTo(vx+Math.cos(an)*s*0.16*p,vy+Math.sin(an)*s*0.16*p);X.lineTo(vx+Math.cos(an)*s*0.04,vy+Math.sin(an)*s*0.04);
      X.lineTo(vx+Math.cos(an+0.5)*s*0.13*p,vy+Math.sin(an+0.5)*s*0.13*p);X.stroke();}}
  if(ko){X.strokeStyle="rgba(225,225,130,.9)";X.lineWidth=2.5;X.beginPath();
    for(let i=0;i<24;i++){const a=t*3+i*0.4,rr=i*0.4;X[i?"lineTo":"moveTo"](Math.cos(a)*rr,headY-RT*1.2+Math.sin(a)*rr*0.6);}X.stroke();}
  X.restore();
}

function frame(now){
  const t=(now-t0)/1000, dpr=Math.min(devicePixelRatio||1,2);
  X.setTransform(dpr,0,0,dpr,0,0);
  const W=cv.width/dpr,H=cv.height/dpr;X.clearRect(0,0,W,H);
  health=Lr(health,target,reduce?1:0.1); load=Lr(load,loadT,0.08);
  const cx=W/2,floorY=H*0.82,s=W*0.13,h=health;
  // neon backlight tinted by health
  const col=h>0.5?[70,255,170]:h>0.25?[255,150,60]:[255,72,96];
  let g=X.createRadialGradient(cx,H*0.46,10,cx,H*0.46,W*0.5);
  g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.16)`);g.addColorStop(1,"rgba(0,0,0,0)");
  X.fillStyle=g;X.fillRect(0,0,W,H);
  // ground shadow
  const sw=s*1.0*(1+(reduce?0:Math.abs(Math.sin(t*(1.5+load*7)))*0.1*(h>0.15?load:0)));
  let sg=X.createRadialGradient(cx,floorY+4,2,cx,floorY+4,sw*1.4);
  sg.addColorStop(0,"rgba(0,0,0,.5)");sg.addColorStop(1,"rgba(0,0,0,0)");
  X.fillStyle=sg;X.beginPath();X.ellipse(cx,floorY+4,sw*1.4,s*0.3,0,0,7);X.fill();
  drawHamster(cx,floorY,s,h,load,t);
  requestAnimationFrame(frame);
}
const dot=document.getElementById("dot"),quip=document.getElementById("quip"),
      hp=document.getElementById("hp"),ld=document.getElementById("ld"),hpv=document.getElementById("hpv"),ldv=document.getElementById("ldv");
function refresh(){const h=target;
  hpv.textContent=Math.round(h*100)+"%";ldv.textContent=Math.round(loadT*100)+"%";
  quip.textContent = h<0.12 ? "x_x  (down)" : h<0.3 ? "running on fumes…" :
    (loadT>0.7 ? (h>0.6?"ZOOMIES.":"pushing hard, not great") : loadT<0.2 ? "just vibing." : "trotting along.");
  const c=h>0.55?"var(--neon)":h>0.25?"#ffb13b":"var(--alarm)";dot.style.background=c;dot.style.boxShadow="0 0 10px "+c;}
hp.addEventListener("input",()=>{target=hp.value/100;refresh();});
ld.addEventListener("input",()=>{loadT=ld.value/100;refresh();});
let manual=false;
hp.addEventListener("pointerdown",()=>{manual=true;});
hp.addEventListener("pointerup",()=>{manual=false;});
window.setHealth=function(pct){ if(manual) return; pct=Math.max(0,Math.min(100,pct)); target=hp.value=pct/100; refresh(); };
(function blinker(){blink=Math.max(0,blink-0.12);if(performance.now()-t0>nextBlink){blink=1;nextBlink=(performance.now()-t0)+1500+Math.random()*3000;}requestAnimationFrame(blinker);})();
const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=380*dpr;cv.style.width="360px";cv.style.height="380px";
refresh();requestAnimationFrame(frame);
</script>
</body>
</html>
