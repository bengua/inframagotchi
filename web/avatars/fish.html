<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>inframagotchi — goldfish</title>
<style>
  :root{--bg:#0a0a0e;--bg2:#13131b;--ink:#e7e9f0;--muted:#6f7484;--neon:#4aff96;--alarm:#ff4860;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 120% at 50% 30%,var(--bg2),var(--bg) 72%);
    color:var(--ink);font-family:var(--mono);display:flex;align-items:center;justify-content:center;overflow:hidden}
  main{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon);transition:.45s}
  @media (max-width: 400px){
    html,body{background:transparent !important}
    main{padding:0 !important;gap:0 !important;max-width:none !important;height:100vh !important;justify-content:center !important}
    .rig,.quip,.menu-btn,header,.dot,.rowlab{display:none !important}
    canvas{width:auto !important;height:96vh !important;max-width:96vw !important;filter:none !important}
  }
  canvas{display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
  .quip{min-height:1.4em;color:var(--muted);font-size:14px;text-align:center;max-width:32ch}
  .rig{display:flex;flex-direction:column;align-items:center;gap:8px;width:300px}
  .rowlab{display:flex;justify-content:space-between;width:100%;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .rowlab b{color:var(--ink);font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--alarm),#ffb13b 50%,var(--neon));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--ink);border:2px solid #0a0a0e;box-shadow:0 0 12px rgba(255,255,255,.35);cursor:grab}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--ink);border:2px solid #0a0a0e;cursor:grab}
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span class="dot" id="dot"></span><span>inframagotchi // goldfish</span></div>
  <canvas id="c" width="360" height="430"></canvas>
  <p class="quip" id="quip"></p>
  <div class="rig">
    <div class="rowlab"><span>infra health</span><b id="pct">100%</b></div>
    <input type="range" id="hp" min="0" max="100" value="100"/>
    <div class="rowlab"><span>cpu load</span><b id="ldv">60%</b></div>
    <input type="range" id="ld" min="0" max="100" value="60"/>
  </div>
</main>
<script>
"use strict";
const cv=document.getElementById("c"), X=cv.getContext("2d");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const L=(a,b,k)=>a+(b-a)*k, CL=(v,a,b)=>Math.max(a,Math.min(b,v));
const MIX=(c1,c2,k)=>[L(c1[0],c2[0],k),L(c1[1],c2[1],k),L(c1[2],c2[2],k)];
const RGB=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const ORANGE=[255,138,38],ORANGE_DK=[214,84,18],BELLY=[255,214,158],FIN=[255,176,96],
      DULL=[176,150,120],INK=[40,24,14],RED=[255,72,96];
let health=1,target=1,load=0.6,loadT=0.6,t0=performance.now(),gravel=[];

function star(x,y,r,a){X.save();X.globalAlpha=a;X.fillStyle="#fff";X.beginPath();
  for(let i=0;i<8;i++){const rr=i%2?r*0.42:r,an=-Math.PI/2+i*Math.PI/4;X[i?"lineTo":"moveTo"](x+Math.cos(an)*rr,y+Math.sin(an)*rr);}
  X.closePath();X.fill();X.restore();}

function drawFish(cx,cy,s,h,t,flip){
  const droop=1-h, body=MIX(ORANGE,DULL,droop*0.8), bdk=MIX(ORANGE_DK,DULL,droop*0.8), fin=MIX(FIN,DULL,droop*0.6);
  const sgn=flip?-1:1, Y=yy=>cy+sgn*(yy-cy);
  const act=Math.max(0,Math.min(1,load*Math.max(0,Math.min(1,(h-0.05)/0.25))));
  const beat=reduce?0:Math.sin(t*(2+6*act))*0.5*L(0.3,1,act);   // tail beat ∝ load
  X.save();
  // tail fan (animated)
  const tx=cx-s*1.05, ta=beat;
  X.fillStyle=RGB(fin);X.beginPath();
  X.moveTo(cx-s*0.55,cy);
  X.lineTo(tx,Y(cy-s*0.55)+ta*s*0.4*sgn);X.lineTo(tx-s*0.2,cy+ta*s*0.5);X.lineTo(tx,Y(cy+s*0.55)+ta*s*0.4*sgn);
  X.closePath();X.fill();
  X.strokeStyle=RGB(bdk);X.lineWidth=2;
  X.beginPath();X.moveTo(cx-s*0.6,cy);X.lineTo(tx,Y(cy-s*0.5)+ta*s*0.4*sgn);X.moveTo(cx-s*0.6,cy);X.lineTo(tx,Y(cy+s*0.5)+ta*s*0.4*sgn);X.stroke();
  // dorsal fin
  X.fillStyle=RGB(fin);X.beginPath();X.moveTo(cx-s*0.2,Y(cy-s*0.5));X.lineTo(cx+s*0.25,Y(cy-s*0.8));X.lineTo(cx+s*0.3,Y(cy-s*0.45));X.closePath();X.fill();
  // body
  X.fillStyle=RGB(body);X.strokeStyle=RGB(INK);X.lineWidth=3;
  X.beginPath();X.ellipse(cx+s*0.12,cy,s*0.82,s*0.5,0,0,7);X.fill();X.stroke();
  // belly
  X.fillStyle=RGB(MIX(BELLY,DULL,droop*0.7));X.beginPath();X.ellipse(cx+s*0.15,Y(cy+s*0.2),s*0.55,s*0.26,0,0,7);X.fill();
  // pectoral fin (waves)
  X.fillStyle=RGB(fin);X.save();X.translate(cx+s*0.15,Y(cy+s*0.2));X.rotate(sgn*(0.3+beat*0.3));
  X.beginPath();X.moveTo(0,0);X.lineTo(-s*0.1,s*0.4);X.lineTo(s*0.25,s*0.2);X.closePath();X.fill();X.restore();
  // gill
  X.strokeStyle=RGB(bdk);X.lineWidth=2;X.beginPath();X.arc(cx+s*0.45,cy,s*0.4,sgn>0?2:-2,sgn>0?4.3:-4.3);X.stroke();
  // eye
  const ex=cx+s*0.6, ey=Y(cy-s*0.14), er=s*0.2;
  if(flip||h<0.12){X.strokeStyle=RGB(INK);X.lineWidth=4;X.lineCap="round";X.beginPath();
    X.moveTo(ex-er*0.7,ey-er*0.7);X.lineTo(ex+er*0.7,ey+er*0.7);X.moveTo(ex-er*0.7,ey+er*0.7);X.lineTo(ex+er*0.7,ey-er*0.7);X.stroke();}
  else{X.fillStyle="#fff";X.strokeStyle=RGB(INK);X.lineWidth=2;X.beginPath();X.arc(ex,ey,er,0,7);X.fill();X.stroke();
    const ir=MIX([50,32,20],RED,droop);
    if(h<0.55){X.save();X.shadowColor=RGB(RED);X.shadowBlur=10*droop;}
    X.fillStyle=RGB(ir);X.beginPath();X.arc(ex,ey,er*0.62,0,7);X.fill();if(h<0.55)X.restore();
    X.fillStyle=RGB(INK);X.beginPath();X.arc(ex,ey,er*0.32,0,7);X.fill();
    X.fillStyle="#fff";X.beginPath();X.arc(ex-er*0.3,ey-er*0.3,er*0.22,0,7);X.fill();}
  // mouth O (gasps when low)
  const gasp=h<0.6&&!reduce?Math.abs(Math.sin(t*3))*s*0.08:0;
  const mo=s*(0.05+0.1*droop)+gasp;
  X.strokeStyle=RGB(bdk);X.lineWidth=2;X.beginPath();X.ellipse(cx+s*0.92,Y(cy+s*0.04),mo*0.8,mo,0,0,7);X.stroke();
  X.restore();
}

function frame(now){
  const t=(now-t0)/1000, dpr=Math.min(devicePixelRatio||1,2);
  X.setTransform(dpr,0,0,dpr,0,0);
  const W=cv.width/dpr,H=cv.height/dpr; X.clearRect(0,0,W,H);
  health=L(health,target,reduce?1:0.1); load=L(load,loadT,reduce?1:0.08);
  const h=health,droop=1-h,cx=W/2,cy=H*0.5,R=W*0.42;
  // neon glow under bowl
  let gl=X.createRadialGradient(cx,cy+R*0.7,8,cx,cy+R*0.7,R);
  gl.addColorStop(0,"rgba(40,200,255,.18)");gl.addColorStop(1,"rgba(40,200,255,0)");
  X.fillStyle=gl;X.fillRect(0,0,W,H);
  const wtop=cy-R+2*R*L(0.1,0.52,droop);
  const wcol=MIX([70,180,220],[96,150,96],droop);
  X.save();
  X.beginPath();X.arc(cx,cy,R,0,7);X.clip();
  // water with wavy surface
  X.fillStyle=`rgba(${wcol[0]|0},${wcol[1]|0},${wcol[2]|0},.6)`;
  X.beginPath();X.moveTo(cx-R,H);X.lineTo(cx-R,wtop);
  for(let x=-R;x<=R;x+=8){const wy=wtop+(reduce?0:Math.sin(t*1.5+x*0.05)*3);X.lineTo(cx+x,wy);}
  X.lineTo(cx+R,H);X.closePath();X.fill();
  // gravel
  for(const g of gravel){X.fillStyle=g.c;X.beginPath();X.ellipse(cx+g.x,cy+R*0.78+g.y,g.r,g.r*0.7,0,0,7);X.fill();}
  // fish
  const flip=h<0.12;
  const actF=Math.max(0,Math.min(1,load*Math.max(0,Math.min(1,(h-0.05)/0.25))));
  const fx=cx+(reduce?0:Math.sin(t*0.9)*R*0.14*actF), fy=flip?wtop+R*0.16:cy+(reduce?0:Math.sin(t*1.4)*R*0.05*actF);
  drawFish(fx,fy,R*0.46,h,t,flip);
  // bubbles
  const nb=Math.round(2+8*actF);
  for(let i=0;i<nb;i++){const sp=20+i*7, by=H-((t*sp+i*60)%(H-wtop+40))+wtop-20;
    const bx=fx+R*0.5+Math.sin(t*2+i)*4, br=2+(i%3);
    if(by>wtop){X.strokeStyle="rgba(220,240,255,.5)";X.lineWidth=1.5;X.beginPath();X.arc(bx,by,br,0,7);X.stroke();}}
  X.restore();
  // emotes (outside clip, near top)
  if(h>0.85)star(cx+R*0.55,cy-R*0.55,R*0.1,0.5+0.5*Math.sin(t*4));
  if(h>0.3&&h<0.72){const ph=(t*0.7)%1,sx=cx+R*0.6,sy=cy-R*0.5+ph*R*0.4;X.fillStyle="#82cdff";X.globalAlpha=1-ph*0.3;
    X.beginPath();X.moveTo(sx,sy-R*0.08);X.quadraticCurveTo(sx+R*0.06,sy+R*0.03,sx,sy+R*0.07);
    X.quadraticCurveTo(sx-R*0.06,sy+R*0.03,sx,sy-R*0.08);X.fill();X.globalAlpha=1;}
  if(h<0.5){const vx=cx-R*0.55,vy=cy-R*0.45,p=1+0.15*Math.sin(t*6);X.strokeStyle="#ff4a60";X.lineWidth=3.5;X.lineCap="round";
    for(let a=0;a<3;a++){const an=a*2*Math.PI/3;X.beginPath();
      X.moveTo(vx+Math.cos(an)*R*0.09*p,vy+Math.sin(an)*R*0.09*p);X.lineTo(vx+Math.cos(an)*R*0.02,vy+Math.sin(an)*R*0.02);
      X.lineTo(vx+Math.cos(an+0.5)*R*0.07*p,vy+Math.sin(an+0.5)*R*0.07*p);X.stroke();}}
  // glass bowl
  X.strokeStyle="rgba(200,224,238,.85)";X.lineWidth=3;X.beginPath();X.arc(cx,cy,R,0,7);X.stroke();
  X.strokeStyle="rgba(255,255,255,.45)";X.lineWidth=4;X.beginPath();X.arc(cx,cy,R-5,Math.PI*0.78,Math.PI*1.12);X.stroke();
  X.strokeStyle="rgba(200,224,238,.85)";X.lineWidth=3;X.beginPath();X.ellipse(cx,cy-R-6,R*0.5,9,0,0,7);X.stroke();
  requestAnimationFrame(frame);
}
const dot=document.getElementById("dot"),quip=document.getElementById("quip"),pct=document.getElementById("pct"),hp=document.getElementById("hp"),ld=document.getElementById("ld"),ldv=document.getElementById("ldv");
function refresh(){const h=target;
  quip.textContent=h>0.6?"swimming happy!":h>0.25?"...not feeling great":"belly up. x_x";
  pct.textContent=Math.round(h*100)+"%";ldv.textContent=Math.round(loadT*100)+"%";
  const col=h>0.55?"var(--neon)":h>0.25?"#ffb13b":"var(--alarm)";dot.style.background=col;dot.style.boxShadow="0 0 10px "+col;}
hp.addEventListener("input",()=>{target=hp.value/100;refresh();});
ld.addEventListener("input",()=>{loadT=ld.value/100;refresh();});
let manual=false;
hp.addEventListener("pointerdown",()=>{manual=true;});
hp.addEventListener("pointerup",()=>{manual=false;});
window.setHealth=function(pct){ if(manual) return; pct=Math.max(0,Math.min(100,pct)); target=hp.value=pct/100; refresh(); };
(function seedGravel(){let a=9;const r=()=>((a=a*1103515245+12345)>>>16)/65536;
  const W=360,R=W*0.42;for(let i=0;i<20;i++)gravel.push({x:(r()-0.5)*R*1.5,y:(r()-0.5)*R*0.16,r:5+r()*8,
    c:["#5a504a","#786454","#465a64"][i%3]});})();
const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=430*dpr;cv.style.width="360px";cv.style.height="430px";
refresh();requestAnimationFrame(frame);
</script>
</body>
</html>
