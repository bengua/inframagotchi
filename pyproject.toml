[project]
name = "inframagotchi"
version = "0.2.1"
description = "A manga stray cat in a window whose health mirrors your homelab."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "FreedzHost" }]
keywords = ["monitoring", "desktop", "pet", "homelab", "pywebview", "pyqt"]
dependencies = ["pywebview>=5"]

[project.optional-dependencies]
qt = ["pywebview[qt]>=5"]

[project.urls]
Homepage = "https://github.com/bengua/inframagotchi"

[project.scripts]
inframagotchi = "app:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
py-modules = ["app", "engine"]
packages = ["probes", "web"]
include-package-data = true

[tool.setuptools.package-data]
web = ["**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
